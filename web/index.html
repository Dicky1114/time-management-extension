<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工数管理</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar">
        <h1>工数マネージャ</h1>
        <p class="subtitle">モバイル対応 / Chrome拡張対応</p>

        <section class="side-panel">
          <h2>ログイン</h2>
          <label>
            ユーザー
            <input id="loginUserInput" placeholder="例: tanaka" list="userList" />
          </label>
          <label class="checkbox-row">
            <input id="rememberUserChk" type="checkbox" checked />
            ユーザーを記憶する
          </label>
          <div class="row">
            <button id="loginBtn">ログイン</button>
            <button id="logoutBtn" class="sub">ログアウト</button>
          </div>
          <p id="loginState" class="subtext">未ログイン</p>
          <datalist id="userList"></datalist>
        </section>

        <section class="side-panel">
          <h2>対象日</h2>
          <label>
            日付
            <input id="dateInput" type="date" />
          </label>
          <div class="row">
            <button id="reloadBtn">再読込</button>
            <button id="saveBtn">保存</button>
          </div>
        </section>

        <section class="side-panel">
          <h2>案件マスタ</h2>
          <div class="row wrap">
            <input id="newProjectName" placeholder="案件名を追加" />
            <button id="addProjectBtn">追加</button>
          </div>
          <ul id="projectList" class="master-list"></ul>
        </section>

        <section class="side-panel">
          <h2>工数名マスタ</h2>
          <div class="row wrap">
            <input id="newTaskNameMaster" placeholder="工数名を追加" />
            <button id="addTaskNameBtn">追加</button>
          </div>
          <ul id="taskNameList" class="master-list"></ul>
        </section>

        <section class="side-panel">
          <h2>通知設定</h2>
          <label class="checkbox-row">
            <input id="notifyBeforeEnabled" type="checkbox" />
            予定終了の残り時間で通知
          </label>
          <label>
            残り(分)
            <input id="notifyBeforeMinutes" type="number" min="1" step="1" value="10" />
          </label>
          <label class="checkbox-row">
            <input id="notifyElapsedEnabled" type="checkbox" />
            経過時間で通知
          </label>
          <label>
            経過(分)
            <input id="notifyElapsedMinutes" type="number" min="1" step="1" value="60" />
          </label>
        </section>
      </aside>

      <section class="content">
        <section class="panel">
          <div class="panel-head">
            <h2>新規工数</h2>
          </div>
          <label class="checkbox-row">
            <input id="parallelToggle" type="checkbox" />
            並列モード
          </label>

          <div id="normalFields" class="row wrap">
            <label>
              工数名
              <input id="newName" placeholder="例: 仕様確認" list="taskNameDatalist" />
            </label>
            <label>
              案件名
              <input id="newProjectSelect" placeholder="案件を選択" list="projectDatalist" />
            </label>
          </div>

          <div id="parallelFields" class="hidden">
            <div class="row wrap">
              <label>
                グループ名
                <input id="parallelGroupName" placeholder="例: 定例MTG" />
              </label>
            </div>
            <div class="sub-builder">
              <div class="row wrap">
                <label>
                  案件名
                  <input id="parallelProject" placeholder="案件を選択" list="projectDatalist" />
                </label>
                <label>
                  工数名
                  <input id="parallelTaskName" placeholder="工数名" list="taskNameDatalist" />
                </label>
                <label>
                  予測(h)
                  <input id="parallelPlanned" type="number" step="0.5" min="0.5" value="0.5" />
                </label>
                <button id="addSubTaskBtn" type="button">＋</button>
              </div>
              <div id="subTaskList" class="sub-task-list"></div>
            </div>
          </div>

          <div class="row wrap">
            <label>
              予定(h)
              <input id="newPlanned" type="number" min="0" step="0.5" value="1" />
            </label>
            <label>
              備考
              <input id="newNote" placeholder="メモ" />
            </label>
            <button id="addBtn">追加</button>
          </div>

          <datalist id="projectDatalist"></datalist>
          <datalist id="taskNameDatalist"></datalist>
        </section>

        <section class="panel">
          <div class="panel-head row between">
            <h2>作業中/未完了</h2>
            <p id="activeSummary" class="subtext"></p>
          </div>
          <div class="task-list" id="activeList"></div>
        </section>

        <section class="panel">
          <div class="panel-head row between">
            <h2>完了一覧</h2>
            <div class="row">
              <button id="copyBtn">全件コピー</button>
              <button id="clearDoneBtn" class="danger">全削除</button>
            </div>
          </div>
          <div class="copy-columns">
            <button data-action="copy-col" data-col="name" type="button">項目</button>
            <button data-action="copy-col" data-col="planned" type="button">想定</button>
            <button data-action="copy-col" data-col="actual" type="button">実際</button>
            <button data-action="copy-col" data-col="user" type="button">担当者</button>
            <button data-action="copy-col" data-col="note" type="button">備考</button>
          </div>
          <div class="task-list" id="doneList"></div>
        </section>

        <p id="message"></p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
