<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工数管理</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar">
        <h1>工数マネージャ</h1>
        <p class="subtitle">モバイル対応 / Chrome拡張対応</p>

        <section class="side-panel">
          <h2>ログイン</h2>
          <label>
            ユーザー
            <input id="loginUserInput" placeholder="例: tanaka" list="userList" />
          </label>
          <label class="checkbox-row">
            <input id="rememberUserChk" type="checkbox" checked />
            ユーザーを記憶する
          </label>
          <div class="row">
            <button id="loginBtn">ログイン</button>
            <button id="logoutBtn" class="sub">ログアウト</button>
          </div>
          <p id="loginState" class="subtext">未ログイン</p>
          <datalist id="userList"></datalist>
        </section>

        <section class="side-panel">
          <h2>対象日</h2>
          <label>
            日付
            <input id="dateInput" type="date" />
          </label>
          <div class="row">
            <button id="reloadBtn">再読込</button>
            <button id="saveBtn">保存</button>
          </div>
        </section>

        <section class="side-panel">
          <h2>案件マスタ</h2>
          <div class="row wrap">
            <input id="newProjectName" placeholder="案件名を追加" />
            <button id="addProjectBtn">追加</button>
          </div>
          <ul id="projectList" class="project-list"></ul>
        </section>
      </aside>

      <section class="content">
        <section class="panel">
          <div class="panel-head">
            <h2>新規工数</h2>
            <p class="subtext">工数名の横に案件名を付けて管理できます</p>
          </div>
          <div class="row wrap">
            <label>
              工数名
              <input id="newName" placeholder="例: 仕様確認" />
            </label>
            <label>
              案件名
              <select id="newProjectSelect"></select>
            </label>
            <label>
              予定(h)
              <input id="newPlanned" type="number" min="0" step="0.5" value="1" />
            </label>
            <label>
              備考
              <input id="newNote" placeholder="メモ" />
            </label>
            <button id="addBtn">追加</button>
          </div>
        </section>

        <section class="panel">
          <h2>作業中/未完了</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>工数名</th>
                  <th>案件名</th>
                  <th>予定</th>
                  <th>実績</th>
                  <th>備考</th>
                  <th>状態</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="activeBody"></tbody>
            </table>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head row between">
            <h2>完了一覧（TSVコピー）</h2>
            <button id="copyBtn">全件TSVコピー</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>日付</th>
                  <th>工数名</th>
                  <th>案件名</th>
                  <th>予定(h)</th>
                  <th>実績(h)</th>
                  <th>備考</th>
                  <th>完了時刻</th>
                  <th>コピー</th>
                </tr>
              </thead>
              <tbody id="doneBody"></tbody>
            </table>
          </div>
        </section>

        <p id="message"></p>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
