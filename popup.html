<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工数管理</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-app">
      <header class="topbar">
        <h1>工数管理</h1>
        <p id="loginState" class="subtext">未ログイン</p>
      </header>

      <section class="card">
        <div class="row">
          <label class="grow">
            担当者
            <input id="loginUserInput" placeholder="例: 田中" list="userList" />
          </label>
        </div>
        <div class="row">
          <label>
            日付
            <input id="dateInput" type="date" />
          </label>
        </div>
        <datalist id="userList"></datalist>
      </section>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="new" type="button">新規</button>
        <button class="tab" data-tab="active" type="button">作業中</button>
        <button class="tab" data-tab="done" type="button">完了</button>
        <button class="tab" data-tab="master" type="button">マスタ</button>
      </nav>

      <section class="card tab-panel" data-panel="new">
        <div class="section-header">
          <h2>新規工数の設定</h2>
          <button id="importCalendarBtn" class="btn-calendar" type="button" title="Googleカレンダーから取込">&#x1F4C5;</button>
        </div>
        <div class="stack">
          <label class="check">
            <input id="parallelToggle" type="checkbox" />
            並列モード
          </label>

          <div id="normalFields" class="stack">
            <label class="combo-field">
              案件名
              <div class="combo-wrap">
                <input id="newProjectField" placeholder="入力 or 候補選択（未登録は自動追加）" />
                <button id="newProjectOpenBtn" type="button" class="combo-open" aria-label="案件候補を開く">▼</button>
              </div>
              <div id="newProjectMenu" class="combo-menu hidden"></div>
            </label>
            <label class="combo-field">
              工数名
              <div class="combo-wrap">
                <input id="newTaskNameField" placeholder="入力 or 候補選択（未登録は自動追加）" />
                <button id="newTaskNameOpenBtn" type="button" class="combo-open" aria-label="工数候補を開く">▼</button>
              </div>
              <div id="newTaskNameMenu" class="combo-menu hidden"></div>
            </label>
          </div>

          <div id="parallelFields" class="hidden">
            <div class="stack">
              <label>
                グループ名
                <input id="parallelGroupName" placeholder="例: 定例MTG" />
              </label>
              <div class="stack sub-builder-row">
                <label class="combo-field">
                  案件名
                  <div class="combo-wrap">
                    <input id="parallelProjectField" placeholder="入力 or 候補選択" />
                    <button id="parallelProjectOpenBtn" type="button" class="combo-open" aria-label="案件候補を開く">▼</button>
                  </div>
                  <div id="parallelProjectMenu" class="combo-menu hidden"></div>
                </label>
                <label class="combo-field">
                  工数名
                  <div class="combo-wrap">
                    <input id="parallelTaskNameField" placeholder="入力 or 候補選択" />
                    <button id="parallelTaskNameOpenBtn" type="button" class="combo-open" aria-label="工数候補を開く">▼</button>
                  </div>
                  <div id="parallelTaskNameMenu" class="combo-menu hidden"></div>
                </label>
                <label>
                  予測(h)
                  <input id="parallelPlannedInput" type="number" step="0.5" min="0.5" value="0.5" />
                </label>
                <button id="addSubTaskBtn" class="sub-builder-add" type="button">＋</button>
              </div>
              <div id="subTaskList" class="sub-task-list"></div>
            </div>
          </div>

          <label>
            予定時間
            <div class="time-input-wrap">
              <input id="newPlanned" type="number" step="0.5" min="0" value="1.0" />
              <span class="time-suffix">時間</span>
            </div>
          </label>
          <label>
            備考
            <input id="newNote" placeholder="メモ" />
          </label>
          <button id="addBtn" type="button">追加</button>
        </div>
      </section>

      <section class="card tab-panel hidden" data-panel="active">
        <h2>作業中 / 未完了</h2>
        <p id="activeSummary" class="subtext"></p>
        <div class="list" id="activeList"></div>
      </section>

      <section class="card tab-panel hidden" data-panel="done">
        <div class="row between">
          <h2>完了</h2>
          <div class="row">
            <button id="copyAllHtmlBtn" type="button">全件コピー</button>
            <button id="clearDoneBtn" class="danger" type="button">全削除</button>
          </div>
        </div>
        <div class="copy-columns">
          <button data-action="copy-col" data-col="name" type="button">項目</button>
          <button data-action="copy-col" data-col="planned" type="button">想定</button>
          <button data-action="copy-col" data-col="actual" type="button">実際</button>
          <button data-action="copy-col" data-col="user" type="button">担当者</button>
          <button data-action="copy-col" data-col="note" type="button">備考</button>
        </div>
        <div class="list" id="doneList"></div>
      </section>

      <section class="card tab-panel hidden" data-panel="master">
        <h2>マスタ管理</h2>
        <div class="master-group">
          <h3>案件名</h3>
          <div class="row">
            <input id="masterProjectInput" class="grow" placeholder="案件名を入力" />
            <button id="addMasterProjectBtn" type="button">追加</button>
          </div>
          <div class="master-list-wrap">
            <ul id="masterProjectList" class="master-list"></ul>
          </div>
        </div>
        <div class="master-group">
          <h3>工数名</h3>
          <div class="row">
            <input id="masterTaskNameInput" class="grow" placeholder="工数名を入力" />
            <button id="addMasterTaskNameBtn" type="button">追加</button>
          </div>
          <div class="master-list-wrap">
            <ul id="masterTaskNameList" class="master-list"></ul>
          </div>
        </div>
        <div class="master-group">
          <h3>通知設定</h3>
          <div class="stack">
            <label class="check">
              <input id="notifyBeforeEnabled" type="checkbox" />
              予定終了の残り時間で通知
            </label>
            <label>
              残り(分)
              <input id="notifyBeforeMinutes" type="number" min="1" step="1" value="10" />
            </label>
            <label class="check">
              <input id="notifyElapsedEnabled" type="checkbox" />
              経過時間で通知
            </label>
            <label>
              経過(分)
              <input id="notifyElapsedMinutes" type="number" min="1" step="1" value="60" />
            </label>
          </div>
        </div>
      </section>

      <datalist id="projectOptions"></datalist>
      <datalist id="taskNameOptions"></datalist>

      <p id="message"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
